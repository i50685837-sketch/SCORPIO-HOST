<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08000f">
  <title>Login — Scorpio Host</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 20%, rgba(120,0,255,.25), transparent 40%),
        linear-gradient(135deg, #050008, #12001d, #07000c);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    /* BRAND */

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 62px;
      height: 62px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #a900ff;
      border-radius: 50%;
      font-size: 32px;
      color: #d58cff;
      text-shadow:
        0 0 10px #a000ff,
        0 0 25px #7200ff;
      box-shadow:
        0 0 20px rgba(145,0,255,.65),
        inset 0 0 20px rgba(145,0,255,.2);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .logo h1 {
      margin-top: 12px;
      font-size: 25px;
      letter-spacing: 4px;
      text-shadow:
        0 0 12px #8c00ff,
        0 0 25px #6100ff;
    }

    .logo p {
      margin-top: 6px;
      color: #bda8c9;
      font-size: 13px;
    }

    /* CARD */

    .card {
      padding: 28px 24px;
      border: 1px solid rgba(190,90,255,.28);
      border-radius: 22px;
      background: rgba(20,5,30,.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 20px 60px rgba(0,0,0,.5),
        0 0 35px rgba(115,0,255,.12);
      animation: cardIn .6s ease;
    }

    .title {
      text-align: center;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #a99aaa;
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* SOCIAL BUTTONS */

    .social {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.055);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .25s;
      margin-bottom: 11px;
    }

    .social:hover {
      transform: translateY(-2px);
      border-color: rgba(190,90,255,.5);
      box-shadow: 0 0 20px rgba(140,0,255,.18);
    }

    /* DIVIDER */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #776b7d;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.1);
    }

    /* FORM */

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d9c8df;
      font-size: 12px;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border-radius: 11px;
      border: 1px solid rgba(190,90,255,.18);
      outline: none;
      background: rgba(0,0,0,.28);
      color: #fff;
      font-size: 14px;
      transition: .25s;
    }

    input::placeholder {
      color: #665d6b;
    }

    input:focus {
      border-color: #a400ff;
      box-shadow:
        0 0 0 3px rgba(145,0,255,.08),
        0 0 18px rgba(145,0,255,.18);
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: #a88baa;
      cursor: pointer;
      font-size: 12px;
    }

    .show-password:hover {
      color: #d18aff;
    }

    /* FORGOT */

    .forgot {
      text-align: right;
      margin-top: -5px;
      margin-bottom: 18px;
    }

    .forgot a {
      color: #bd71f4;
      font-size: 12px;
      text-decoration: none;
    }

    .forgot a:hover {
      color: #dbadff;
      text-shadow: 0 0 10px #8b00ff;
    }

    /* LOGIN BUTTON */

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg,#7200ff,#b000ff);
      box-shadow: 0 0 20px rgba(140,0,255,.35);
      transition: .25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(140,0,255,.55);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #918595;
    }

    .register a {
      color: #c47aff;
      text-decoration: none;
      font-weight: 700;
    }

    .register a:hover {
      text-shadow: 0 0 10px #a000ff;
    }

    .status {
      display: none;
      padding: 11px;
      margin-bottom: 17px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
    }

    .status.error {
      display: block;
      color: #ffb8d0;
      border: 1px solid rgba(255,70,140,.25);
      background: rgba(255,0,100,.08);
    }

    .status.success {
      display: block;
      color: #c9ffdc;
      border: 1px solid rgba(70,255,150,.2);
      background: rgba(0,255,120,.07);
    }

    .terms {
      text-align: center;
      color: #675e6c;
      font-size: 10px;
      line-height: 1.6;
      margin-top: 18px;
    }

    @keyframes pulse {
      0%,100% {
        box-shadow:
          0 0 20px rgba(145,0,255,.65),
          inset 0 0 20px rgba(145,0,255,.2);
      }

      50% {
        box-shadow:
          0 0 35px rgba(145,0,255,.95),
          0 0 60px rgba(100,0,255,.3),
          inset 0 0 25px rgba(145,0,255,.3);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BRAND -->

    <div class="logo">
      <div class="logo-icon">♏</div>
      <h1>SCORPIO HOST</h1>
      <p>Deploy. Run. Scale.</p>
    </div>

    <!-- LOGIN CARD -->

    <div class="card">

      <h2 class="title">Welcome Back</h2>

      <p class="subtitle">
        Login to manage your bots
      </p>

      <div id="status"></div>

      <!-- GOOGLE -->

      <button class="social" type="button" onclick="continueWithGoogle()">

        <svg width="21" height="21" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M21.35 12.23c0-.79-.07-1.55-.2-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.92-4.18 2.92-7.42z"/>
          <path fill="#34A853"
            d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.75z"/>
          <path fill="#FBBC05"
            d="M6.53 13.84A5.86 5.86 0 0 1 6.22 12c0-.64.11-1.26.31-1.84V7.63H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.37l3.24-2.53z"/>
          <path fill="#EA4335"
            d="M12 6.13c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.83 3.15 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.38l3.24 2.53C7.3 7.85 9.46 6.13 12 6.13z"/>
        </svg>

        Continue with Google

      </button>

      <!-- GITHUB -->

      <button class="social" type="button" onclick="continueWithGitHub()">

        <svg width="21" height="21" viewBox="0 0 24 24" fill="white">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.13c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18A10.94 10.94 0 0 1 12 5.9c.97 0 1.94.13 2.85.38 2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.73.8.78 1.08.78 2.18v3.23c0 .3.21.65.79.54C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/>
        </svg>

        Continue with GitHub

      </button>

      <div class="divider">
        OR CONTINUE WITH EMAIL
      </div>

      <!-- LOGIN FORM -->

      <form id="loginForm">

        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
              id="toggleBtn"
            >
              Show
            </button>

          </div>

        </div>

        <div class="forgot">
          <a href="forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button
          class="login-btn"
          id="loginBtn"
          type="submit"
        >
          Login
        </button>

      </form>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create account</a>
      </div>

      <div class="terms">
        Secure access to your Scorpio Host account.
      </div>

    </div>

  </div>


  <script>

    /* =========================
       GOOGLE LOGIN
    ========================= */

    function continueWithGoogle() {
      window.location.href = "/api/auth/google";
    }


    /* =========================
       GITHUB LOGIN
    ========================= */

    function continueWithGitHub() {
      window.location.href = "/api/auth/github";
    }


    /* =========================
       PASSWORD VISIBILITY
    ========================= */

    function togglePassword() {

      const password =
        document.getElementById("password");

      const button =
        document.getElementById("toggleBtn");

      if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

      } else {

        password.type = "password";
        button.textContent = "Show";

      }
    }


    /* =========================
       STATUS MESSAGE
    ========================= */

    function showStatus(message, type) {

      const status =
        document.getElementById("status");

      status.textContent = message;
      status.className = "status " + type;

    }


    /* =========================
       LOGIN
    ========================= */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const loginBtn =
          document.getElementById("loginBtn");

        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";

        try {

          const response = await fetch(
            "/api/auth/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email,
                password
              })
            }
          );

          const data = await response.json();

          if (!response.ok) {

            showStatus(
              data.message || "Invalid email or password.",
              "error"
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Login";

            return;
          }

          /*
            Store JWT if the backend returns one.
          */

          if (data.token) {
            localStorage.setItem(
              "scorpio_token",
              data.token
            );
          }

          showStatus(
            "Login successful. Redirecting...",
            "success"
          );

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 700);

        } catch (error) {

          console.error(error);

          showStatus(
            "Unable to connect to Scorpio Host.",
            "error"
          );

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }

      });

  </script>

</body>
  </html>
