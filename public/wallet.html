<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet - Scorpio Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0518;
      --card-bg: rgba(22, 11, 46, 0.55);
      --card-border: rgba(157, 78, 221, 0.25);
      --accent-purple: #9d4edd;
      --accent-glow: #7b2cbf;
      --neon-light: #e0aaff;
      --text-main: #f3f0ff;
      --text-muted: #a392c9;
      --danger: #ff4d6d;
      --success: #38b000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(123, 44, 191, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(60, 9, 108, 0.3) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* HEADER */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.5rem 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .logo-icon {
      font-size: 1.6rem;
      color: var(--neon-light);
      text-shadow: 0 0 12px var(--accent-purple);
    }

    /* GLASS CARDS */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: border-color 0.3s ease;
    }

    /* WALLET SUMMARY */
    .wallet-card {
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .wallet-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.5rem;
    }

    .balance-amount {
      font-size: 2.75rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #fff;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 0 25px rgba(157, 78, 221, 0.7);
      transform: translateY(-2px);
    }

    /* FORM CARDS */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(10, 5, 24, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 10px rgba(157, 78, 221, 0.3);
    }

    .info-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    /* STATUS MODAL/OVERLAY */
    .status-box {
      display: none;
      text-align: center;
      padding: 1.5rem;
      border-radius: 16px;
      animation: fadeIn 0.3s ease;
    }

    .status-pending {
      background: rgba(157, 78, 221, 0.15);
      border: 1px solid var(--accent-purple);
    }

    .status-success {
      background: rgba(56, 176, 0, 0.15);
      border: 1px solid var(--success);
    }

    .status-error {
      background: rgba(255, 77, 109, 0.15);
      border: 1px solid var(--danger);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--neon-light);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 0.75rem auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* TRANSACTIONS TABLE */
    .tx-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tx-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .tx-desc {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .tx-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tx-amount-group {
      text-align: right;
    }

    .tx-amount {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .tx-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      display: inline-block;
      margin-top: 0.2rem;
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge-SUCCESS { background: rgba(56, 176, 0, 0.2); color: #52b788; }
    .badge-PENDING { background: rgba(255, 183, 3, 0.2); color: #ffb703; }
    .badge-FAILED, .badge-CANCELLED { background: rgba(255, 77, 109, 0.2); color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER -->
    <header class="brand-header">
      <div class="logo">
        <span class="logo-icon">♏</span>
        <span>Scorpio Host</span>
      </div>
    </header>

    <!-- WALLET SUMMARY -->
    <div class="glass-card wallet-card">
      <div class="wallet-title">Available Balance</div>
      <div class="balance-amount" id="walletBalance">KES --.--</div>
    </div>

    <!-- PENDING/STATUS NOTIFICATION BOX -->
    <div id="statusBox" class="status-box"></div>

    <!-- DEPOSIT CARD -->
    <div id="depositSection" class="glass-card">
      <h3 style="margin-bottom: 1.25rem; font-size: 1.1rem;">Deposit via M-Pesa</h3>
      <form id="depositForm" onsubmit="handleDeposit(event)">
        <div class="form-group">
          <label class="form-label">Amount (KES)</label>
          <input type="number" id="depositAmount" class="form-input" placeholder="e.g. 100" min="50" required />
          <div class="info-hint">Minimum deposit: KES 50</div>
        </div>

        <div class="form-group">
          <label class="form-label">M-Pesa Phone Number</label>
          <input type="tel" id="depositPhone" class="form-input" placeholder="07XXXXXXXX or 01XXXXXXXX" required />
        </div>

        <button type="submit" id="depositSubmitBtn" class="btn btn-primary">
          Pay with M-Pesa
        </button>
      </form>
    </div>

    <!-- TRANSACTION HISTORY -->
    <div class="glass-card">
      <div class="tx-title">
        <span>Recent Deposits</span>
      </div>
      <div class="tx-list" id="txList">
        <div style="text-align: center; color: var(--text-muted); padding: 1rem;">Loading history...</div>
      </div>
    </div>
  </div>

  <script>
    let pollInterval = null;

    // Retrieve auth token
    function getAuthToken() {
      return localStorage.getItem('authToken') || localStorage.getItem('token') || '';
    }

    // Fetch Wallet Balance and History
    async function fetchWallet() {
      try {
        const response = await fetch('/api/wallet/balance', {
          headers: {
            'Authorization': `Bearer ${getAuthToken()}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) throw new Error('Failed to load wallet');

        const data = await response.json();
        document.getElementById('walletBalance').innerText = `${data.currency} ${data.balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        renderTransactions(data.transactions || []);
      } catch (err) {
        console.error('Wallet error:', err);
      }
    }

    // Render Transaction List
    function renderTransactions(transactions) {
      const container = document.getElementById('txList');
      if (!transactions || !transactions.length) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 1rem;">No deposit transactions found</div>`;
        return;
      }

      container.innerHTML = transactions.map(tx => {
        const dateStr = new Date(tx.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        return `
          <div class="tx-item">
            <div class="tx-info">
              <div class="tx-desc">M-Pesa Deposit</div>
              <div class="tx-date">${dateStr}</div>
            </div>
            <div class="tx-amount-group">
              <div class="tx-amount" style="color: #52b788">+ KES ${tx.amount.toLocaleString()}</div>
              <span class="tx-badge badge-${tx.status}">${tx.status}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // Handle Deposit Submission
    async function handleDeposit(e) {
      e.preventDefault();
      const amount = document.getElementById('depositAmount').value;
      const phone = document.getElementById('depositPhone').value;
      const submitBtn = document.getElementById('depositSubmitBtn');

      if (amount < 50) {
        showStatus('error', 'Minimum deposit is KES 50');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending STK Push...';

      try {
        const res = await fetch('/api/payments/intasend/stk', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${getAuthToken()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ amount, phone })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'STK Push failed');
        }

        showStatus('pending', `
          <div class="spinner"></div>
          <strong style="color: var(--neon-light);">STK Push Sent</strong><br/>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Check your phone and enter your M-Pesa PIN.</span>
        `);

        // Start Polling for Status
        startPolling(data.invoiceId);
      } catch (err) {
        showStatus('error', err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Pay with M-Pesa';
      }
    }

    // Poll Backend Status Endpoint
    function startPolling(invoiceId) {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/payments/intasend/status/${invoiceId}`, {
            headers: { 'Authorization': `Bearer ${getAuthToken()}` }
          });

          if (!res.ok) return;

          const data = await res.json();

          if (data.status === 'SUCCESS') {
            clearInterval(pollInterval);
            showStatus('success', `
              <strong style="color: #52b788;">Payment Successful</strong><br/>
              <span style="font-size: 0.85rem;">Your Scorpio Host wallet has been credited with KES ${data.amount}.</span>
            `);
            document.getElementById('depositForm').reset();
            fetchWallet();
          } else if (['FAILED', 'CANCELLED', 'EXPIRED'].includes(data.status)) {
            clearInterval(pollInterval);
            showStatus('error', `Transaction ${data.status.toLowerCase()}. Please try again.`);
            fetchWallet();
          }
        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 3000);
    }

    // Helper Status Banner
    function showStatus(type, htmlContent) {
      const box = document.getElementById('statusBox');
      box.className = `status-box status-${type}`;
      box.innerHTML = htmlContent;
      box.style.display = 'block';
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', fetchWallet);
  </script>
</body>
</html>
