<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet — Scorpio Host</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#08000f;
    color:#fff;
    min-height:100vh;
}

.header{
    padding:22px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(10,0,20,.85);
}

.header h1{
    font-size:24px;
}

.header p{
    color:#9f92aa;
    margin-top:6px;
    font-size:14px;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:25px 18px 50px;
}

.balance-card{
    padding:25px;
    border-radius:22px;
    background:linear-gradient(
        135deg,
        #21003b,
        #10001d
    );
    border:1px solid rgba(190,70,255,.25);
    box-shadow:0 15px 50px rgba(90,0,150,.2);
    margin-bottom:25px;
}

.balance-label{
    color:#aaa0b4;
    font-size:14px;
}

.balance{
    font-size:36px;
    font-weight:700;
    margin-top:8px;
}

.currency{
    font-size:15px;
    color:#b88bd0;
}

.card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:22px;
    backdrop-filter:blur(15px);
}

.card h2{
    font-size:20px;
    margin-bottom:7px;
}

.card .subtitle{
    color:#948a9d;
    font-size:13px;
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#c7becd;
    font-size:13px;
}

.input-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:13px;
    background:#120b19;
    color:#fff;
    border:1px solid rgba(255,255,255,.09);
    font-size:15px;
}

input:focus{
    border-color:#a83cff;
    box-shadow:0 0 0 3px rgba(168,60,255,.1);
}

.amount-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:18px;
}

.amount-buttons button{
    border:none;
    padding:12px 5px;
    border-radius:11px;
    background:#170d20;
    color:#cdbbd6;
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
}

.amount-buttons button:hover{
    background:#281033;
}

.deposit-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #a52dff,
        #6b16d9
    );
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(145,30,255,.25);
}

.deposit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
}

.status.show{
    display:block;
}

.status.success{
    background:rgba(0,180,100,.1);
    border:1px solid rgba(0,220,130,.2);
    color:#72efb2;
}

.status.error{
    background:rgba(255,50,80,.1);
    border:1px solid rgba(255,50,80,.2);
    color:#ff8798;
}

.status.info{
    background:rgba(90,120,255,.1);
    border:1px solid rgba(90,120,255,.2);
    color:#a8b7ff;
}

.note{
    margin-top:18px;
    color:#786e80;
    font-size:12px;
    line-height:1.6;
    text-align:center;
}

.back{
    display:inline-block;
    margin-top:22px;
    color:#b45cff;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<header class="header">
    <h1>💳 Wallet</h1>
    <p>Manage your Scorpio Host balance</p>
</header>

<main class="container">

    <section class="balance-card">
        <div class="balance-label">
            Available Balance
        </div>

        <div class="balance">
            <span class="currency">KES</span>
            <span id="balance">0.00</span>
        </div>
    </section>


    <section class="card">

        <h2>Deposit Funds</h2>

        <p class="subtitle">
            Add money securely using M-Pesa
        </p>


        <div class="input-group">

            <label for="amount">
                Amount (KES)
            </label>

            <input
                type="number"
                id="amount"
                min="1"
                placeholder="Enter amount"
                inputmode="numeric"
            >

        </div>


        <div class="amount-buttons">

            <button onclick="setAmount(50)">
                KES 50
            </button>

            <button onclick="setAmount(100)">
                KES 100
            </button>

            <button onclick="setAmount(250)">
                KES 250
            </button>

            <button onclick="setAmount(500)">
                KES 500
            </button>

            <button onclick="setAmount(1000)">
                KES 1,000
            </button>

            <button onclick="setAmount(2000)">
                KES 2,000
            </button>

        </div>


        <div class="input-group">

            <label for="phone">
                M-Pesa Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="0712345678"
                inputmode="tel"
            >

        </div>


        <div class="input-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="your@email.com"
            >

        </div>


        <button
            class="deposit-btn"
            id="depositBtn"
            onclick="deposit()"
        >
            Request M-Pesa STK
        </button>


        <div
            id="status"
            class="status"
        ></div>


        <div class="note">
            After tapping the button, check your phone
            for the M-Pesa payment prompt.
        </div>

    </section>


    <a
        href="/dashboard.html"
        class="back"
    >
        ← Back to Dashboard
    </a>

</main>


<script>

const amountInput =
    document.getElementById("amount");

const phoneInput =
    document.getElementById("phone");

const emailInput =
    document.getElementById("email");

const depositBtn =
    document.getElementById("depositBtn");

const statusBox =
    document.getElementById("status");


function setAmount(amount){

    amountInput.value = amount;

}


function showStatus(
    message,
    type = "info"
){

    statusBox.textContent = message;

    statusBox.className =
        "status show " + type;

}


function normalizePhone(phone){

    let value =
        phone
        .trim()
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    if(value.startsWith("+254")){
        value =
            value.substring(1);
    }


    if(
        value.startsWith("07") ||
        value.startsWith("01")
    ){
        value =
            "254" +
            value.substring(1);
    }


    if(
        value.length === 9 &&
        (
            value.startsWith("7") ||
            value.startsWith("1")
        )
    ){
        value =
            "254" + value;
    }


    return value;
}


async function deposit(){

    const amount =
        Number(amountInput.value);

    const phone =
        normalizePhone(
            phoneInput.value
        );

    const email =
        emailInput.value.trim();


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showStatus(
            "Enter a valid deposit amount.",
            "error"
        );

        return;
    }


    if(
        !/^254(7|1)\d{8}$/.test(phone)
    ){

        showStatus(
            "Enter a valid Kenyan M-Pesa number.",
            "error"
        );

        return;
    }


    depositBtn.disabled = true;

    depositBtn.textContent =
        "Sending STK Prompt...";


    showStatus(
        "Contacting IntaSend...",
        "info"
    );


    try{

        const response =
            await fetch(
                "/api/intasend/stk",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        amount,

                        phoneNumber:
                            phone,

                        email,

                        firstName:
                            "Scorpio",

                        lastName:
                            "Host"

                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to start payment."
            );

        }


        showStatus(
            "✅ STK prompt sent! Check your M-Pesa phone and complete the payment.",
            "success"
        );


        console.log(
            "IntaSend response:",
            data
        );


    }catch(error){

        console.error(error);

        showStatus(
            "❌ " + error.message,
            "error"
        );


    }finally{

        depositBtn.disabled = false;

        depositBtn.textContent =
            "Request M-Pesa STK";

    }

}

</script>

</body>
</html>
